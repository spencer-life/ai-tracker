[tools]
go = "1.26.5"
"golangci-lint" = "latest"

[tasks.build]
description = "Build the ai-tracker CLI"
run = "mkdir -p .build && go build -o .build/ai-tracker ."

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.run]
description = "Run the application locally"
run = "go run main.go"

[tasks.clean]
description = "Remove local build output"
run = "rm -rf .build/"

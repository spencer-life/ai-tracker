# Managed by claude-config security-baseline.py; do not edit.
name: Secretlint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Scan tracked files with Secretlint v13.0.4
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work
          secretlint/secretlint@sha256:3b3f8d2ea61ab21ce1f8185d69e7cad12e040fa5370d8f5462dd366fd24ef765
          secretlint --format github --no-gitignore "**/*"
